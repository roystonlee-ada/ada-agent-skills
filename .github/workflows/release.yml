name: Release

on:
  push:
    branches: [main]
    paths:
      - plugins/ada-agent-skills/.claude-plugin/plugin.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugins/ada-agent-skills/.claude-plugin/plugin.json | head -1)
          [ -n "$version" ] || { echo "No version found"; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version already released"
            exit 0
          fi
          awk -v v="$version" '
            $0 == "## " v { on = 1; next }
            /^## / && on { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "v$version" --target "$GITHUB_SHA" --title "$version" --notes-file notes.md
